name: Deploy slides to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  LANG: "ja_JP.UTF-8"
  SLIDE: 講義資料.md

jobs:
  build:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Packages
        run: sudo apt update && sudo apt install -y fonts-noto-cjk

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Make Directory
        run: |
          mkdir dest
          cp -r ./img ./dest/img

      - name: Build Marp HTML
        run: marp "$SLIDE"
          --html
          -o ./dest/index.html
          --allow-local-files

      - name: Build Marp PDF
        run: marp "$SLIDE"
          --pdf
          -o ./dest/slide.pdf
          --allow-local-files

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dest

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
